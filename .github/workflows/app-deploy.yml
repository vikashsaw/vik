name: App Deployment & Automation Trigger

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  trigger-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Official, zero-config step to wait for Vercel's URL
      - name: Wait for Vercel Deployment Link
        uses: vercel/wait-for-deployment-action@v3.1.0
        id: vercel_deploy
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Triggers your custom automation repository path
      - name: Trigger Automation Pipeline
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.QAAUTOMATON }}
          repository: vikashsaw/PlaywrightAutomationFramework
          event-type: trigger-automation-tests
          client-payload: '{"app_url": "${{ steps.vercel_deploy.outputs.url }}"}'
