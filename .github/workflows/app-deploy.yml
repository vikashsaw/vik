name: App Deployment & Automation Trigger

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  trigger-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. This action reads your repository and pings Vercel to get the live link
      - name: Fetch Vercel Deployment URL
        uses: amondnet/vercel-action@v25
        id: vercel_deploy
        with:
          vercel-token: ${{ secrets.GITHUB_TOKEN }} # Uses built-in token
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: "dummy_id" # Standard placeholder for raw HTML
          vercel-project-id: "dummy_id"

      # 2. Uses your custom token to trigger your automation repo
      - name: Trigger Automation Pipeline
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TEST_AUTO_VIKAS_2411 }}
          repository: vikashsaw/PlaywrightAutomationFramework
          event-type: trigger-automation-tests
          # This action saves the live link inside 'outputs.preview-url'
          client-payload: '{"app_url": "${{ steps.vercel_deploy.outputs.preview-url }}"}'
