name: App Deployment & Automation Trigger

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

# This blocks grants permission to read Vercel's API logs 
permissions:
  deployments: read
  contents: read

jobs:
  trigger-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Waits for Vercel using the unlocked token permissions
      - name: Wait for Vercel Deployment Link
        uses: vercel/wait-for-deployment-action@main
        id: vercel_deploy
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} # Switched to github-token as per official repo spec

      # 2. Triggers your custom automation repository path using QAAUTOMATION
      - name: Trigger Automation Pipeline
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.QAAUTOMATION }}
          repository: vikashsaw/PlaywrightAutomationFramework
          event-type: trigger-automation-tests
          client-payload: '{"app_url": "${{ steps.vercel_deploy.outputs.deployment-url }}"}'
